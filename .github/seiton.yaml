  # runner-no-latest:
  #   fix-mapping:
  #     ubuntu-latest: "ubuntu-24.04"
  #     windows-latest: "windows-2025"
  #     macos-latest: "macos-15"

  # credentials:
  #   public-registries:
  #     - ghcr.io

  # cache-poisoning-trigger:
  #   untrusted-triggers:
  #     - issue_comment

  # unredacted-secrets:
  #   output-commands:
  #     - tee

  # forbidden-uses:
  #   allow:
  #     - actions/*
  #   deny:
  #     - some-untrusted-org/*

  # unpinned-uses:
  #   ignore-actions:
  #     - owner: "my-org/*"
  #     - owner: "my-org/internal-action"
  #     - owner: "my-org/setup-*"
  #       refs: [main, master]

  # overprovisioned-secrets:
  #   max-step-env-secrets: 5
  #   max-job-secrets: 5

  # expr-undefined-var:
  #   assume-events:
  #     - workflow_dispatch

  # Online rules (default: disabled). Enable individually:
  # known-vulnerable-actions:
  #   enabled: true
  # impostor-commit:
  #   enabled: true
  # ref-confusion:
  #   enabled: true
  # stale-action-refs:
  #   enabled: true

exclusions:
  # - file: .github/workflows/legacy-*.yml
  #   rules:
  #     - runner-no-latest
  #   jobs:
  #     - legacy
  # File-only exclusion (excludes entire file from rule checks):
  # - file: .github/workflows/generated.yml

fix:
  defaults:
    job-timeout-minutes: 15
  pinning:
    enable-network: true
    min-age-days: 7
    exclude-branches:
      - main
    # ignore-actions:
    #   - uses: "slsa-framework/*"
    #     ref: "*"
  images:
    enable-network: true
    # exclude-images:
    #   - scratch
    # exclude-tags:
    #   - latest
    # ignore-images:
    #   - mcr.microsoft.com/**

network:
  # on-error: skip
  # timeout-seconds: 30
  # max-concurrency: (omit; default is min(4, logical CPUs))
  # github:
  #   ghes-api-url: ""
  #   ghes-fallback: false

output:
