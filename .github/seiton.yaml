# Seiton linter configuration
# Preferred location: .github/seiton.yaml

rules:
  unpinned-uses:
    ignore-actions:
      - owner: guitarrapc/actions
  # Example: override a rule's behavior.
  # dangerous-triggers:
  #   severity: warning
  #   events:
  #     - issue_comment

  # runner-label:
  #   known-hosted-labels:
