name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description:
          "Existing Git tag to release (e.g. v1.0.0). Must already exist on
          the remote."
        required: true
        type: string

permissions: {}

jobs:
  # Gate: validate version, run tests, verify generated data
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve tag ref
        id: ref
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${TAG}"
            TAG="v${RAW#v}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}

      - name: Verify tag on remote (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.ref.outputs.tag }}" --silent --fail \
            || { echo "::error::Tag '${{ steps.ref.outputs.tag }}' does not exist on the remote. Push it first, then re-run."; exit 1; }

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ steps.ref.outputs.tag }}

      - name: Verify version ↔ tag consistency
        id: version
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          # Extract version from Directory.Build.props
          PROPS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          TAG_VERSION="${TAG#v}"
          if [ "$PROPS_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: Directory.Build.props has '$PROPS_VERSION' but tag is '$TAG' (expected '$TAG_VERSION')"
            exit 1
          fi
          echo "version=${PROPS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "### Version check passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${PROPS_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: guitarrapc/actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0
      - name: Install wasm-tools workload (Seiton.Playground / Blazor WASM)
        run: dotnet workload install wasm-tools
      - name: Build
        run: dotnet build -c Release
      - name: Install Playwright (Chromium) for playground UI tests
        run: |
          pwsh tests/Seiton.Playground.Tests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Pre-publish Playground for UI tests (avoid in-test WASM AOT peak RAM)
        run: |
          dotnet publish src/Seiton.Playground/Seiton.Playground.csproj -c Debug -o publish/playground-dbg/ -v q -p:RunAOTCompilation=false -p:PublishTrimmed=false -p:PlaygroundSoftFingerprint=true
          dotnet publish src/Seiton.Playground/Seiton.Playground.csproj -c Release -o publish/playground-aot/ -v q -p:RunAOTCompilation=true -p:PublishTrimmed=true -p:PlaygroundSoftFingerprint=true
      - name: Test
        run: dotnet test -c Release --no-build
        env:
          SEITON_PLAYGROUND_PUBLISH_DIR_DEBUG: ${{ github.workspace }}/publish/playground-dbg
          SEITON_PLAYGROUND_PUBLISH_DIR_RELEASE: ${{ github.workspace }}/publish/playground-aot
      - name: Verify generated data
        run: dotnet run --project src/Seiton.Update -- verify --dataset all

  # Publish: multi-platform AOT binaries
  publish:
    needs: validate
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            artifact: seiton-linux-amd64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            artifact: seiton-linux-arm64
          - os: windows-2025
            rid: win-x64
            artifact: seiton-win-amd64
          - os: windows-11-arm
            rid: win-arm64
            artifact: seiton-win-arm64
          - os: macos-26
            rid: osx-arm64
            artifact: seiton-osx-arm64
          - os: macos-26-intel
            rid: osx-x64
            artifact: seiton-osx-amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - uses: guitarrapc/actions/.github/actions/setup-dotnet@main
        with:
          dotnet-version: 10.0

      - name: Publish (AOT)
        shell: bash
        run: |
          dotnet publish src/Seiton/Seiton.csproj -c Release -r ${{ matrix.rid }} -o publish/ -p:CopyOutputSymbolsToPublishDirectory=false -p:DebugType=none

      - name: Prepare release bundle
        shell: bash
        run: |
          cp README.md LICENSE.md publish/
          cp -r docs publish/

      - name: Create archive (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: |
          cd publish
          tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Create archive (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  # GHCR: linux/amd64 + linux/arm64 from published Linux AOT tarballs
  docker:
    needs: [validate, publish]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout (Dockerfile)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: GHCR image name (lowercase)
        id: ghcr
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Prepare multi-arch context
        run: |
          set -euo pipefail
          mkdir -p ctx/amd64 ctx/arm64
          AMD64_TGZ="$(find artifacts -name seiton-linux-amd64.tar.gz -type f | head -1)"
          ARM64_TGZ="$(find artifacts -name seiton-linux-arm64.tar.gz -type f | head -1)"
          test -n "$AMD64_TGZ" && test -n "$ARM64_TGZ"
          tar xzf "$AMD64_TGZ" -C ctx/amd64
          tar xzf "$ARM64_TGZ" -C ctx/arm64
          test -f ctx/amd64/seiton && test -f ctx/arm64/seiton
          chmod +x ctx/amd64/seiton ctx/arm64/seiton
          cp Dockerfile ctx/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./ctx
          file: ./ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.ghcr.outputs.image }}:latest
            ${{ steps.ghcr.outputs.image }}:${{ needs.validate.outputs.version }}
            ${{ steps.ghcr.outputs.image }}:${{ needs.validate.outputs.tag }}

      - name: Image summary
        run: |
          echo "### GHCR image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ghcr.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ghcr.outputs.image }}:${{ needs.validate.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.ghcr.outputs.image }}:${{ needs.validate.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Release: create GitHub Release with checksums + SLSA attestation
  release:
    needs: [validate, publish]
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Collect release assets and generate checksums
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/ -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum * > checksums-sha256.txt
          echo "### Release assets" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat checksums-sha256.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Create GitHub Release
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "v${VERSION}" --generate-notes --draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
