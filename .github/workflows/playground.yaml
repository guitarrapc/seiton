name: Deploy Playground

concurrency:
  group: pages
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Git tag to deploy (e.g. v1.0.0 or 1.0.0). Must already exist on the remote."
        required: true
        type: string

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Normalize tag (workflow_dispatch)
        id: tag
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          RAW: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          V="${RAW#v}"
          if [ -z "$V" ]; then
            echo "::error::version input must not be empty."
            exit 1
          fi
          echo "ref=v${V}" >> "$GITHUB_OUTPUT"

      - name: Verify tag on remote (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.tag.outputs.ref }}" --silent --fail \
            || { echo "::error::Tag '${{ steps.tag.outputs.ref }}' does not exist on the remote. Push it first, then re-run."; exit 1; }

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.ref || github.ref }}

      - name: Deploy summary
        run: |
          echo "### Playground deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ref:** \`${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.ref || github.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      # No -p:Version: the tree at this ref already defines Version (Directory.Build.props etc.).
      - name: Publish Playground (browser-wasm Release)
        run: |
          dotnet publish src/Seiton.Playground/Seiton.Playground.csproj -c Release -r browser-wasm -p:PlaygroundSoftFingerprint=true -o publish/
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publish/wwwroot

  deploy:
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
