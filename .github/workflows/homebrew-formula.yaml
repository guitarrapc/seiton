name: Bump Homebrew Formula

# Publish a release → regenerate Formula/seiton.rb on the default branch from
# checksums-sha256.txt (same-repo tap pattern; cf. rhysd/actionlint Casks/).

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: homebrew-formula-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump-formula:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SYNCED_ACTIONS_BOT_APPID }}
          private-key: ${{ secrets.SYNCED_ACTIONS_BOT_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          # Use the GitHub App token for checkout to match the token used for the later push.
          token: ${{ steps.app-token.outputs.token }}

      - name: Commit Formula/seiton.rb
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SEITON_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://github-actions:${GITHUB_TOKEN}@github.com/${{ github.repository }}"
          VERSION="${SEITON_TAG#v}"
          export SEITON_VERSION="$VERSION"
          export CHECKSUMS_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${SEITON_TAG}/checksums-sha256.txt"
          bash scripts/commit-homebrew-formula.sh
