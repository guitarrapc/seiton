name: Deploy Playground

on:
  push:
    branches: [main]
    paths:
      - 'src/Seiton.Playground/**'
      - 'src/Seiton.Playground.Core/**'
      - 'src/Seiton.Core/**'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Publish Playground (browser-wasm Release)
        run: dotnet publish src/Seiton.Playground/Seiton.Playground.csproj -c Release -r browser-wasm

      - name: Add .nojekyll
        run: touch src/Seiton.Playground/bin/Release/net10.0/publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/Seiton.Playground/bin/Release/net10.0/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
