name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate Homebrew formula render (fixture)
        run: bash scripts/test-homebrew-formula-render.sh
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0
      - name: Install wasm-tools workload (Seiton.Playground / Blazor WASM)
        run: dotnet workload install wasm-tools
      - name: Build
        run: dotnet build -c Release
      - name: Install Playwright (Chromium) for playground UI tests
        run: |
          pwsh tests/Seiton.Playground.Tests/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Pre-publish Playground for UI tests (avoid in-test WASM AOT peak RAM)
        run: |
          dotnet publish src/Seiton.Playground/Seiton.Playground.csproj -c Debug -o publish/playground-dbg/ -v q -p:RunAOTCompilation=false -p:PublishTrimmed=false -p:PlaygroundSoftFingerprint=true
          dotnet publish src/Seiton.Playground/Seiton.Playground.csproj -c Release -o publish/playground-aot/ -v q -p:RunAOTCompilation=true -p:PublishTrimmed=true -p:PlaygroundSoftFingerprint=true
      - name: Test
        run: dotnet test -c Release --no-build
        env:
          SEITON_PLAYGROUND_PUBLISH_DIR_DEBUG: ${{ github.workspace }}/publish/playground-dbg
          SEITON_PLAYGROUND_PUBLISH_DIR_RELEASE: ${{ github.workspace }}/publish/playground-aot
      - name: Publish (CLI)
        run: dotnet publish src/Seiton/Seiton.csproj -c Release -r linux-x64 -o publish/cli/
      - name: Publish (Playground)
        run: |
          dotnet publish src/Seiton.Playground/Seiton.Playground.csproj -c Release -r browser-wasm -p:PlaygroundSoftFingerprint=true -o publish/playground/

      - name: Verify CLI build
        run: |
          chmod +x ./publish/cli/seiton
          ./publish/cli/seiton version
      - name: Verify Docker image build (linux/amd64 only, no push)
        run: |
          set -euo pipefail
          mkdir -p docker-smoke/amd64
          cp publish/cli/seiton docker-smoke/amd64/seiton
          chmod +x docker-smoke/amd64/seiton
          cp Dockerfile docker-smoke/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Docker build (load locally)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./docker-smoke
          file: ./docker-smoke/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: seiton:ci-verify
      - name: Run seiton in container
        run: docker run --rm seiton:ci-verify version

  verify-updater:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: guitarrapc/actions/.github/actions/setup-dotnet@9122a18b0dea07585a242b9eb6ed7886f8587c49 # v1.0.1
        with:
          dotnet-version: 10.0
      - name: Validate Popular Actions Targets
        run: dotnet run --project src/Seiton.Update -- validate-popular-actions-targets
      - name: Verify Generated Data
        run: dotnet run --project src/Seiton.Update -- verify --dataset all
