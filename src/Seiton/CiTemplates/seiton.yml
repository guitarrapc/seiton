name: Seiton Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "action.yml"
      - "action.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "action.yml"
      - "action.yaml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Default on GitHub Actions: --format github-actions (rich stdout + job summary).
      # Pin the image tag (e.g. :v0.9.21) instead of :latest for reproducible CI.
      - name: Run seiton
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -e GITHUB_ACTIONS \
            -e GITHUB_STEP_SUMMARY \
            ghcr.io/guitarrapc/seiton:latest \
            --include-actions

  # Optional: GitHub Code Scanning (SARIF). Uncomment this job and add workflow permissions:
