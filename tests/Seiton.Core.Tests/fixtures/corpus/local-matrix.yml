name: local-matrix
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [dev, prod]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - if: ${{ startsWith(github.ref, 'refs/heads/') }}
        run: echo ${{ matrix.os }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
